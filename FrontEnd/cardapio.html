<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cardápio | Rei do Rango</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f5f5;
}

/* HEADER */

header{

    background:#ff0000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 8%;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 4px 10px rgba(0,0,0,.15);

}

.logo{

    display:flex;
    align-items:center;
    gap:15px;

}

.logo img{
    height: 70px;
    object-fit: contain;
    

}

.logo h1{

    font-family:'Bebas Neue';
    font-size:42px;
    letter-spacing:2px;
    color: aliceblue;

}

nav{

    display:flex;
    gap:25px;

}

nav a{

    color:white;
    text-decoration:none;
    font-weight:600;
    transition:.3s;

}

nav a:hover{

    opacity:.8;

}

.usuario{

    display:flex;
    align-items:center;
    gap:15px;

}

.btn-img{
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
}

.btn-img img{
    width: 50px;
    height: auto;
    display: block;
}

.btn-img:hover{
    transform: scale(1.05);
}

/* BANNER */

.banner{

    width:90%;
    margin:30px auto;

    background:#ff0000;

    color:white;

    border-radius:20px;

    padding:40px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}

.banner h2{

    font-family:'Bebas Neue';
    font-size:55px;

}

.banner p{

    margin-top:10px;
    font-size:18px;

}

.banner img{

    width:280px;

}

/* PESQUISA */

.pesquisa{

    width:90%;
    margin:auto;

}

.pesquisa input{

    width:100%;

    padding:18px;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:16px;

    box-shadow:0 3px 10px rgba(0,0,0,.1);

}

/* CATEGORIAS */

.categorias{

    width:90%;
    margin:25px auto;

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}

.categorias button{

    background:white;

    color:#444;

    border:none;

    border-radius:30px;

    padding:12px 25px;

    cursor:pointer;

    transition:.3s;

    font-weight:600;

}

.categorias button:hover{

    background:#ff3131;
    color:white;

}

/* PRODUTOS */

#produtos{

    width:90%;

    margin:35px auto;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

    gap:25px;

}
.card{

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 5px 15px rgba(0,0,0,.1);

    transition:.3s;

}

.card:hover{

    transform:translateY(-8px);

}

.card img{

    width:100%;

    height:220px;

    object-fit:cover;

}

.info{

    padding:20px;

}

.info h2{

    color:#ff3131;

    font-size:24px;

    margin-bottom:10px;

}

.info p{

    color:#666;

    font-size:14px;

    margin-bottom:18px;

    min-height:45px;

}

.preco{

    font-size:25px;

    color:#222;

    font-weight:bold;

    margin-bottom:20px;

}

.btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#ff3131;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}

.btn:hover{

    background:#d62828;

}

footer{

    margin-top:60px;

    background:#222;

    color:white;

    text-align:center;

    padding:25px;

}



@media(max-width:900px){

.banner{

flex-direction:column;

text-align:center;

gap:30px;

}

.banner img{

width:180px;

}

header{

flex-direction:column;

gap:20px;

}

nav{

flex-wrap:wrap;

justify-content:center;

}

}

</style>

</head>

<body>


<header>


<div class="logo">

<img src="Rei do Rango (2).png" alt="Logo" class="logo">

</div>

<nav>

<a href="#">Cardápio</a>
<a href="#">Meus Pedidos</a>
<a href="#">Perfil</a>

</nav>

<div class="usuario">

<div class="carrinho">

   <button class="btn-img">
    <img src="carrinho.png" alt="Carrinho">
    </button>

</div>

</div>

</header>

<section class="banner">

<div>

<h2>O melhor hambúrguer da cidade</h2>

<p>Escolha seu lanche favorito e faça seu pedido.</p>

</div>



</section>

<section class="pesquisa">

<input
type="text"
placeholder="Pesquisar lanche...">

</section>

<section class="categorias">

<button>Todos</button>

<button>Carnes</button>

<button>Frango</button>

<button>Bebidas</button>

<button>Promoções</button>

</section>

<div id="produtos">


<footer>

© 2026 Rei do Rango - Todos os direitos reservados.

</footer>

</body>

</html>
