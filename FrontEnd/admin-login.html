<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Rei do Rango</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  background: #fff;
}

/* fundo igual seu site */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: url('Brabo.png');
  background-size: cover;
  background-position: center;
  opacity: 0.15;
  z-index: -1;
}

.admin-container {
  background: #fff;
  padding: 40px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  border-bottom: 6px solid #ff3131;
}

.admin-container h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  color: #ff3131;
  margin-bottom: 10px;
}

.admin-container p {
  color: #666;
  margin-bottom: 25px;
}

.form-group {
  text-align: left;
  margin-bottom: 20px;
}

label {
  font-size: 13px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid #eee;
  margin-top: 5px;
  transition: 0.3s;
}

input:focus {
  border-color: #4dbff2;
  outline: none;
}

.btn-admin {
  width: 100%;
  background: #ff3131;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.btn-admin:hover {
  background: #d62828;
  transform: translateY(-2px);
}

/* botão voltar */
.voltar {
  position: absolute;
  top: 20px;
  left: 20px;
  text-decoration: none;
  color: #ff3131;
  font-weight: 600;
}
</style>
</head>

<body>

<a href="index.html" class="voltar">← Voltar</a>

<div class="admin-container">
  <h2>ÁREA ADMIN</h2>
  <p>Acesso restrito para administradores</p>

  <form id="adminForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" required>
    </div>

    <button type="submit" class="btn-admin">Entrar como Admin</button>
  </form>
</div>

<script>
document.getElementById("adminForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const res = await fetch("http://localhost:3000/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, senha })
    });

    const dados = await res.json();

    if (!dados.token) {
      return alert("Login inválido");
    }

    const payload = JSON.parse(atob(dados.token.split('.')[1]));

    if (payload.role !== "admin") {
      return alert("Você não é administrador");
    }

    localStorage.setItem("token", dados.token);

    window.location.href = "admin.html";

  } catch (err) {
    alert("Erro ao conectar com servidor");
  }
});
</script>

</body>
</html>
