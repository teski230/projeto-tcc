<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Rei do Rango</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('Brabo.png');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }

    .cadastro-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
      border-bottom: 6px solid #ff3131;
    }

    .cadastro-container h2 {
      font-family: 'Bebas Neue', sans-serif;
      color: #ff3131;
      font-size: 40px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .cadastro-container p {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #eee;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
      font-size: 15px;
    }

    .form-group input:focus {
      border-color: #4dbff2;
    }

    .btn-cadastrar {
      width: 100%;
      background-color: #ff3131;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn-cadastrar:hover {
      background-color: #d62828;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 49, 49, 0.3);
    }

    .login-link {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

    .login-link a {
      color: #4dbff2;
      text-decoration: none;
      font-weight: 600;
    }

    .voltar {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #ff3131;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <a href="index.html" class="voltar">← Voltar para a Home</a>

  <div class="cadastro-container">
    <h2>CRIE SUA CONTA</h2>
    <p>Cadastre-se para garantir o melhor rango da cidade!</p>

    <form>
      <div class="form-group">
        <label for="nome">NOME COMPLETO</label>
        <input type="text" id="nome" placeholder="Como podemos te chamar?" required>
      </div>

      <div class="form-group">
        <label for="email">E-MAIL</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="senha">SENHA</label>
        <input type="password" id="senha" placeholder="Crie uma senha forte" required>
      </div>

      <button type="submit" class="btn-cadastrar">FINALIZAR CADASTRO</button>
    </form>

    <div class="login-link">
      Já tem uma conta?<a href="login.html">Faça login</a>
    </div>
  </div>

  <!-- 🔥 SCRIPT DE CONEXÃO COM BACKEND -->
  <script>
    document.querySelector("form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        const resposta = await fetch("http://localhost:3000/cadastro", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, email, senha })
        });

        const dados = await resposta.json();

        console.log(dados);

        alert(dados.message || "Cadastro realizado!");

        // redireciona se der certo
        if (dados.sucess || dados.success) {
          window.location.href = "login.html";
        }

      } catch (erro) {
        console.error(erro);
        alert("Erro ao conectar com o servidor");
      }
    });
  </script>

</body>
</html>
