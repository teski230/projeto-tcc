
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  font-family: 'Poppins';
}

body {
  display: flex;
  background: #f5f5f5;
}

/* SIDEBAR */
.sidebar {
  width: 230px;
  height: 100vh;
  background: #ff3131;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  font-family: 'Bebas Neue';
  margin-bottom: 30px;
}

.sidebar button {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: none;
  background: white;
  color: #ff3131;
  border-radius: 8px;
  cursor: pointer;
}

/* MAIN */
.main {
  flex: 1;
  padding: 30px;
}

h1 {
  color: #ff3131;
  margin-bottom: 20px;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 20px;
}

.card-dashboard {
  background: white;
  padding: 20px;
  border-left: 6px solid #ff3131;
  border-radius: 10px;
}

.card-dashboard p {
  font-size: 22px;
  font-weight: bold;
}

/* CLIENTES */
.card {
  background: white;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}

input, select {
  padding: 6px;
  margin-right: 5px;
  margin-bottom: 5px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

select {
  min-width: 170px;
  background: white;
  cursor: pointer;
}

.btn {
  background: #ff3131;
  color: white;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
}

/* ENTREGADORES */
.card-entregador {
  background: white;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
  border-left: 6px solid #ff3131;
}

.card-entregador .info p {
  font-size: 14px;
  margin: 2px 0;
}

.card-entregador .acoes {
  margin-top: 10px;
}

.btn-aprovar {
  background: #2ecc71;
}

.btn-recusar {
  background: #ff3131;
}

.badge {
  padding: 3px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
}

.badge-pendente { background: #f5a623; }
.badge-aprovado { background: #2ecc71; }
.badge-recusado { background: #ff3131; }
</style>
</head>

<body>

<div class="sidebar">
  <h2>Admin</h2>
  <button onclick="dashboard()">Dashboard</button>
  <button onclick="listarClientes()">Clientes</button>
  <button onclick="listarProdutos()">Produtos</button>
  <button onclick="listarEntregadores()">Entregadores</button>
  <button onclick="logout()">Sair</button>
</div>

<div class="main">
  <h1>Painel do Administrador</h1>
  <div id="conteudo"></div>
</div>

<script>
const token = localStorage.getItem("token");

if (!token) {
  alert("Faça login");
  window.location.href = "admin-login.html";
}

const payload = JSON.parse(atob(token.split('.')[1]));

if (payload.role !== "admin") {
  alert("Acesso negado");
  window.location.href = "index.html";
}

// DASHBOARD
async function dashboard() {
  try {
    const clientes = await fetch("http://localhost:3000/clientes", {
      headers: { Authorization: "Bearer " + token }
    }).then(r => r.json());

    const pedidos = await fetch("http://localhost:3000/pedidos", {
      headers: { Authorization: "Bearer " + token }
    }).then(r => r.json());

    // Mês e ano atuais
    const agora = new Date();

    const anoAtual = agora.getFullYear();
    const mesAtual = String(agora.getMonth() + 1).padStart(2, "0");

    const mesAnoAtual = `${anoAtual}-${mesAtual}`;

    // Filtra somente os pedidos do mês atual
    const pedidosDoMes = pedidos.filter(p => {
      if (!p.data_pedido) return false;

      const dataPedido = String(p.data_pedido);

      return dataPedido.substring(0, 7) === mesAnoAtual;
    });

    // Soma o valor dos pedidos deste mês
    const total = pedidosDoMes.reduce(
      (soma, pedido) => soma + Number(pedido.valor || 0),
      0
    );

    const valorFormatado = total.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    document.getElementById("conteudo").innerHTML = `
      <div class="cards">

        <div class="card-dashboard">
          <h3>Clientes</h3>
          <p>${clientes.length}</p>
        </div>

        <div class="card-dashboard">
          <h3>Pedidos</h3>
          <p>${pedidos.length}</p>
        </div>

        <div class="card-dashboard">
          <h3>Vendas do Mês</h3>
          <p>${valorFormatado}</p>
        </div>

      </div>
    `;

  } catch (erro) {
    console.error("Erro ao carregar dashboard:", erro);

    document.getElementById("conteudo").innerHTML = `
      <div class="card">
        Não foi possível carregar os dados do dashboard.
      </div>
    `;
  }
}

// CLIENTES
async function listarClientes() {
  const res = await fetch("http://localhost:3000/clientes", {
    headers: { Authorization: "Bearer " + token }
  });

  const dados = await res.json();

  let html = "<h2>Clientes</h2>";

  dados.forEach(c => {
    html += `
      <div class="card">
        <div>
          <input id="nome-${c.id_cliente}" value="${c.nome}">
          <input id="email-${c.id_cliente}" value="${c.email}">
        </div>

        <button class="btn" onclick="editar(${c.id_cliente})">
          Salvar
        </button>
      </div>
    `;
  });

  document.getElementById("conteudo").innerHTML = html;
}

// EDITAR
async function editar(id) {
  const nome = document.getElementById(`nome-${id}`).value;
  const email = document.getElementById(`email-${id}`).value;

  await fetch(`http://localhost:3000/clientes/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ nome, email })
  });

  alert("Atualizado!");
}

async function carregarCategorias() {

  try {

    const res = await fetch("http://localhost:3000/categorias");

    if (!res.ok) {
      throw new Error("Erro ao buscar categorias");
    }

    return await res.json();

  } catch (erro) {

    console.error("Erro ao carregar categorias:", erro);

    return [];
  }
}


function criarOptionsCategorias(categorias, categoriaSelecionada = "") {

    let options = `
        <option value="">
            Selecione uma categoria
        </option>
    `;

    categorias.forEach(categoria => {

        options += `
            <option
                value="${categoria.id_categoria}"
                ${String(categoria.id_categoria) === String(categoriaSelecionada) ? "selected" : ""}
            >
                ${categoria.nome}
            </option>
        `;

    });

    if (categorias.length === 0) {
        options = `
            <option value="">
                Nenhuma categoria encontrada
            </option>
        `;
    }

    return options;
} 


async function listarProdutos() {

  try {

    const res = await fetch("http://localhost:3000/produtos");

    if (!res.ok) {
      throw new Error("Erro ao buscar produtos");
    }

    const produtos = await res.json();

    // As categorias são buscadas separadamente.
    // Assim, mesmo com 0 produtos, o formulário aparece.
    const categorias = await carregarCategorias();

    let html = `
      <h2>Produtos</h2>

      <br>

      <h3>Novo Produto</h3>

      <div class="card">

        <div>

          <input id="novoNome" placeholder="Nome">

          <input
            id="novoPreco"
            type="number"
            step="0.01"
            min="0"
            placeholder="Preço"
          >

          <input id="novaDescricao" placeholder="Descrição">

          <input id="novaImagem" type="file" accept="image/*">

          <select id="novaCategoria">
            ${criarOptionsCategorias(categorias)}
          </select>

        </div>

        <button class="btn" onclick="adicionarProduto()">
          Adicionar
        </button>

      </div>

      <br>
    `;

    if (produtos.length === 0) {

      html += `
        <div class="card">
          Nenhum produto cadastrado ainda.
        </div>
      `;

    } else {

      produtos.forEach(p => {

        html += `
          <div class="card">

            <div>

              <input
                id="nome-${p.id_produto}"
                value="${p.nome || ""}"
              >

              <input
                id="preco-${p.id_produto}"
                type="number"
                step="0.01"
                min="0"
                value="${p.preco || 0}"
              >

              <input
                id="descricao-${p.id_produto}"
                value="${p.descricao || ""}"
              >

              <input
                id="imagem-${p.id_produto}"
                value="${p.imagem || ""}"
              >

              <select id="categoria-${p.id_produto}">
                ${criarOptionsCategorias(categorias, p.categoria)}
              </select>

            </div>

            <div>

              <button
                class="btn"
                onclick="editarProduto(${p.id_produto})"
              >
                Salvar
              </button>

              <button
                class="btn"
                onclick="excluirProduto(${p.id_produto})"
              >
                Excluir
              </button>

            </div>

          </div>
        `;

      });
    }

    document.getElementById("conteudo").innerHTML = html;

  } catch (erro) {

    console.error("Erro ao carregar produtos:", erro);

    document.getElementById("conteudo").innerHTML = `
      <h2>Produtos</h2>

      <div class="card">
        Não foi possível carregar os produtos.
      </div>
    `;
  }
}


async function adicionarProduto() {

    const nome = document.getElementById("novoNome").value.trim();
    const preco = document.getElementById("novoPreco").value;
    const descricao = document.getElementById("novaDescricao").value;
    const categoria = document.getElementById("novaCategoria").value;

    const arquivoImagem =
        document.getElementById("novaImagem").files[0];

    if (!nome) {
        alert("Digite o nome do produto.");
        return;
    }

    if (!preco) {
        alert("Digite o preço.");
        return;
    }

    if (!categoria) {
        alert("Selecione uma categoria.");
        return;
    }

    if (!arquivoImagem) {
        alert("Selecione uma imagem.");
        return;
    }

    try {

        const formData = new FormData();

        formData.append("nome", nome);
        formData.append("preco", preco);
        formData.append("descricao", descricao);
        formData.append("categoria", categoria);
        formData.append("imagem", arquivoImagem);

        const res = await fetch(
            "http://localhost:3000/ADCprodutos",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + token
                },

                body: formData
            }
        );

        const dados = await res.json();

        if (!res.ok) {
            throw new Error(
                dados.message || "Erro ao cadastrar produto"
            );
        }

        alert("Produto cadastrado com sucesso!");

        listarProdutos();

    } catch (erro) {

        console.error(erro);

        alert(erro.message);
    }
}


async function editarProduto(id) {

  const nome = document.getElementById(`nome-${id}`).value;
  const preco = document.getElementById(`preco-${id}`).value;
  const descricao = document.getElementById(`descricao-${id}`).value;
  const imagem = document.getElementById(`imagem-${id}`).value;
  const categoria = document.getElementById(`categoria-${id}`).value;

  if (!categoria) {
    alert("Selecione uma categoria.");
    return;
  }

  try {

    const res = await fetch(
      `http://localhost:3000/ATZprodutos/${id}`,
      {
        method: "PUT",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
          nome,
          preco,
          descricao,
          imagem,
          categoria: Number(categoria)
        })
      }
    );

    const dados = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(
        dados.message || "Erro ao atualizar produto"
      );
    }

    alert("Produto atualizado!");

    listarProdutos();

  } catch (erro) {

    console.error(erro);

    alert(erro.message);
  }
}


async function excluirProduto(id) {

  if (!confirm("Deseja excluir este produto?")) return;

  try {

    const res = await fetch(
      `http://localhost:3000/DELprodutos/${id}`,
      {
        method: "DELETE",

        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const dados = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(
        dados.message || "Erro ao excluir produto"
      );
    }

    alert("Produto excluído!");

    listarProdutos();

  } catch (erro) {

    console.error(erro);

    alert(erro.message);
  }
}

// ENTREGADORES
async function listarEntregadores() {
  const pendentes = await fetch("http://localhost:3000/entregadores/pendentes", {
    headers: { Authorization: "Bearer " + token }
  }).then(r => r.json());

  const todos = await fetch("http://localhost:3000/entregadores", {
    headers: { Authorization: "Bearer " + token }
  }).then(r => r.json());

  let html = "<h2>Solicitações Pendentes</h2><br>";

  if (pendentes.length === 0) {
    html += `<div class="card">Nenhuma solicitação pendente.</div>`;
  } else {
    pendentes.forEach(e => {
      html += `
        <div class="card-entregador" id="pendente-${e.id_entregador}">
          <div class="info">
            <p><b>${e.nome}</b></p>
            <p>Email: ${e.email}</p>
            <p>CNH: ${e.CNH} | Telefone: ${e.telefone}</p>
            <p>Veículo: ${e.veiculo} - ${e.placa}</p>
          </div>
          <div class="acoes">
            <button class="btn btn-aprovar" onclick="aprovarEntregador(${e.id_entregador})">Aprovar</button>
            <button class="btn btn-recusar" onclick="recusarEntregador(${e.id_entregador})">Recusar</button>
          </div>
        </div>
      `;
    });
  }

  html += "<br><h2>Todos os Entregadores</h2><br>";

  todos.forEach(e => {
    html += `
      <div class="card">
        <div>
          <b>${e.nome}</b> - ${e.email} - ${e.veiculo} (${e.placa})
        </div>
        <span class="badge badge-${e.status}">${e.status}</span>
      </div>
    `;
  });

  document.getElementById("conteudo").innerHTML = html;
}

async function aprovarEntregador(id) {
  if (!confirm("Aprovar este entregador? Ele poderá fazer login no app.")) return;

  await fetch(`http://localhost:3000/entregadores/${id}/aprovar`, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token }
  });

  alert("Entregador aprovado!");
  listarEntregadores();
}

async function recusarEntregador(id) {
  if (!confirm("Recusar este entregador?")) return;

  await fetch(`http://localhost:3000/entregadores/${id}/recusar`, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token }
  });

  alert("Entregador recusado.");
  listarEntregadores();
}

// LOGOUT
function logout() {
  localStorage.removeItem("token");
  window.location.href = "admin-login.html";
}

dashboard();
</script>

</body>
</html>
